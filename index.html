<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Начертательная геометрия — калькулятор</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a2f;--mute:#5d6b70;--line:#d8ddd9;--acc:#0f6b5c;--acc2:#e8f3f0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px clamp(12px,2vw,24px) 0;flex:none}
h1{margin:0;font:600 1.25rem/1.2 Georgia,"Times New Roman",serif}
header p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;padding:10px clamp(12px,2vw,24px) 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.side{overflow:auto;min-height:0}
.out{display:flex;flex-direction:column;min-height:0;overflow:hidden}
h2{margin:0 0 8px;font-size:1rem}
#tasks{display:grid;gap:8px;margin-bottom:14px}
.task{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer;font:inherit;color:inherit}
.task small{display:block;color:var(--mute)}
.task.on{border-color:var(--acc);background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.task:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pt{display:grid;grid-template-columns:28px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:6px}
.pt b{font-size:1.1rem}
.pt input{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit}
.pt .h{color:var(--mute);font-size:.8rem}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.b{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.b.alt{background:#fff;color:var(--acc)}
button.b.on{background:var(--acc);color:#fff}
button.b:disabled{opacity:.4;cursor:default}
.leg{flex:none;margin-bottom:6px}
.leg span{display:inline-block;margin-right:14px;font-size:.85rem}
.leg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
/* Окно чертежа: занимает всё свободное место, SVG вписывается целиком (viewBox + meet) */
#wrap{flex:1 1 auto;min-height:180px;position:relative;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.nav{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;flex:none}
.nav .sp{flex:1}
#sn{font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
#cur{margin-top:8px;max-height:26vh;overflow:auto;flex:none}
.res{background:var(--acc2);border-left:4px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:1.02rem;margin-top:6px}
.err{color:#b42318}
details{margin-top:14px}
details ol{padding-left:20px;margin:8px 0 0}
details li{margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.1;margin:0 1px}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:1px solid currentColor}
sub{font-size:.7em;line-height:0}
@media(max-width:900px){
  body{height:auto;overflow:auto;display:block}
  main{display:block}
  .side{overflow:visible;margin-bottom:12px}
  .out{overflow:visible}
  #wrap{flex:none;height:62vh}
  #cur{max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>Эпюр Монжа: способы преобразования проекций</h1>
  <p>Работает локально. Измените координаты — решение пересчитается. Листайте шаги или включите «Готовое решение».</p>
</header>
<main>
  <section class="card side">
    <h2>Задача</h2>
    <div id="tasks"></div>
    <h2>Координаты точек (X, Y, Z)</h2>
    <div id="pts"></div>
    <div class="btns">
      <button class="b alt" id="reset">Сбросить значения</button>
    </div>
    <details id="all"><summary>Все шаги решения</summary><div id="steps"></div></details>
  </section>
  <section class="card out">
    <div class="leg" id="leg"></div>
    <div id="wrap"><svg id="epure" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="nav">
      <button class="b alt" id="prev">‹ Шаг назад</button>
      <b id="sn"></b>
      <button class="b" id="next">Шаг вперёд ›</button>
      <span class="sp"></span>
      <button class="b alt" id="done" aria-pressed="false">Готовое решение</button>
      <button class="b" id="png">Сохранить в PNG</button>
      <button class="b alt" id="dl">Скачать SVG</button>
    </div>
    <div id="cur"></div>
  </section>
</main>

<script>
'use strict';
/* ================= Константы и данные ================= */
const K = 5;      // масштаб: пикселей на единицу координат
const GAP = 30;   // зазор между новой осью и ближайшей проекцией, px
const COL = {h:'#2563eb', v:'#dc2626', p3:'#059669', p4:'#7c3aed', tr:'#b45309'};
const TASKS = {
  dihedral:{title:'Эпюр 1: Двугранный угол пирамиды при ребре BS', desc:'Пирамида SABC, грани ABS и CBS: П2/П1 → П1/П3 → П3/П4', pts:'ABCS',
            leg:[['П1 (A₁, B₁, C₁, S₁)',COL.h],['П2 (A₂, B₂, C₂, S₂)',COL.v],['П3 (A₃…S₃)',COL.p3],['П4 (A₄…S₄)',COL.p4]]},
  rot:{title:'Эпюр 2: Истинная величина треугольника ABC способом вращения вокруг следа', desc:'Горизонтальный след Q₁, перпендикуляры, дуги, A₀B₀C₀', pts:'ABC',
       leg:[['П1 (A₁, B₁, C₁)',COL.h],['П2 (A₂, B₂, C₂)',COL.v],['След Q₁, точки 1₁, 2₁, 3₁, центр O₁',COL.tr],['И.В. треугольника A₀B₀C₀',COL.p4]]}
};
const DEF = {A:[70,15,10], B:[20,45,50], C:[95,55,35], S:[40,10,75]};
let task='dihedral', IT=[], ST=0, STEPS=[], cur=0, VB=null, done=false;
const $=id=>document.getElementById(id);

/* ================= Векторная математика ================= */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], len=a=>Math.hypot(a[0],a[1]), nrm=a=>mul(a,1/len(a));
const s3=(a,b)=>a.map((v,i)=>v-b[i]), d3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], l3=a=>Math.sqrt(d3(a,a));
const x3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const deg=r=>r*180/Math.PI, f=x=>(Math.round(x*100)/100).toFixed(2);
const angle2=(a,b)=>deg(Math.acos(Math.max(-1,Math.min(1,dot(a,b)/len(a)/len(b)))));
/* Эпюр: ось X влево, П1 — под осью (y вниз), П2 — над осью (z вверх) */
const H=p=>[-p[0]*K, p[1]*K];
const V=p=>[-p[0]*K, -p[2]*K];
const ax=(a,b)=>`X<span class="fr"><i>${a}</i><i>${b}</i></span>`;

/* ================= Сцена: элементы с номером шага ST ================= */
const line=(a,b,cls,col)=>IT.push({k:'l',s:ST,a,b,cls,col});
const text=(p,t,col,dx=7,dy=-7,dot=true)=>IT.push({k:'t',s:ST,p,t,col,dx,dy,dot});
const poly=(a,col)=>IT.push({k:'p',s:ST,a,col});
function ticks(a,b,k,col){
  const L=len(sub(b,a)); if(L<1e-6) return; const u=nrm(sub(b,a)), w=[-u[1],u[0]], m=mul(add(a,b),.5);
  for(let j=0;j<k;j++){const c=add(m,mul(u,(j-(k-1)/2)*8)); line(add(c,add(mul(w,-8),mul(u,-4))),add(c,add(mul(w,8),mul(u,4))),'edge',col);}
}
const axisLabel=(p,fr)=>IT.push({k:'f',s:ST,p,fr});
function arc(c,p1,p2,col){
  const r=len(sub(p1,c)), a1=Math.atan2(p1[1]-c[1],p1[0]-c[0]), a2=Math.atan2(p2[1]-c[1],p2[0]-c[0]);
  let df=a2-a1; while(df>Math.PI)df-=2*Math.PI; while(df<-Math.PI)df+=2*Math.PI;
  const q=add(c,[r*Math.cos(a1+df/2),r*Math.sin(a1+df/2)]), e=add(c,[r*Math.cos(a2),r*Math.sin(a2)]);
  IT.push({k:'a',s:ST,d:`M${p1} A${r},${r} 0 0 ${df>0?1:0} ${e}`,p1,p2:e,m:q,col});
  return {mid:a1+df/2,r};
}

function replace(S,c,n){
  const m=Math.min(...S.map(p=>dot(p,n)))-GAP, F=[];
  const N=S.map((p,i)=>{const d=dot(p,n)-m; F.push(sub(p,mul(n,d))); return sub(p,mul(n,d+c[i]*K));});
  return {Q:mul(n,m), t:[-n[1],n[0]], F, N, d:S.map(p=>dot(p,n)-m)};
}
function normalFor(u){
  const n=[-u[1],u[0]];
  return (n[1]>1e-9||(Math.abs(n[1])<=1e-9&&n[0]>0))?mul(n,-1):n;
}
function axis(r,name,extra){
  const ss=[...r.F,...r.N,...extra].map(p=>dot(p,r.t)), a=Math.min(...ss)-25, b=Math.max(...ss)+25;
  line(add(r.Q,mul(r.t,a)),add(r.Q,mul(r.t,b)),'ax','#111'); axisLabel(add(r.Q,mul(r.t,a)),name);
}
function shape(P,col){
  poly([P[0],P[1],P[2]],col); poly([P[0],P[1],P[3]],col); poly([P[0],P[2],P[3]],col);
  [[0,2],[0,3],[1,2],[1,3],[2,3]].forEach(([i,j])=>line(P[i],P[j],'thin',col));
  line(P[0],P[1],'edge',col);
}

/* ================= Задача 1: двугранный угол при ребре BS ================= */
function solveDihedral(P){
  const names=['B','S','A','C'], pts=names.map(n=>P[n]), Hs=pts.map(H), Vs=pts.map(V);
  if(len(sub(Hs[1],Hs[0]))<1e-6) throw new Error('Проекция B1S1 вырождается в точку (BS ⟂ П1). Измените координаты B или S.');
  const r1=replace(Hs,pts.map(p=>p[2]),normalFor(nrm(sub(Hs[1],Hs[0]))));
  let v=nrm(sub(r1.N[1],r1.N[0])); if(v[0]>1e-9||(Math.abs(v[0])<=1e-9&&v[1]>0)) v=mul(v,-1);
  const r2=replace(r1.N,r1.d.map(d=>d/K),v);
  const S4=r2.N[1], A4=r2.N[2], C4=r2.N[3], dA=sub(A4,S4), dC=sub(C4,S4);
  const e=s3(P.S,P.B), perp=X=>{const w=s3(X,P.B),k=d3(w,e)/d3(e,e);return w.map((x,i)=>x-k*e[i])};
  const pa=perp(P.A), pc=perp(P.C);
  if(l3(pa)<1e-9||l3(pc)<1e-9) throw new Error('Точка A или C лежит на прямой BS — грань вырождается.');
  const an=angle2(dA,dC), chk=deg(Math.acos(Math.max(-1,Math.min(1,d3(pa,pc)/l3(pa)/l3(pc)))));
  const xs=[...Hs,...Vs,...r1.N,...r2.N].map(p=>p[0]), x0=Math.min(...xs)-20, x1=Math.max(...xs)+20;
  const lab=(P,suf,col)=>names.forEach((n,i)=>text(P[i],n+suf,col));
  ST=0; line([x0,0],[x1,0],'ax','#111'); axisLabel([x0,0],['П2','П1']); lab(Hs,'_1',COL.h); lab(Vs,'_2',COL.v);
  ST=1; shape(Hs,COL.h); shape(Vs,COL.v); names.forEach((n,i)=>line(Hs[i],Vs[i],'cn'));
  ST=2; axis(r1,['П1','П3'],Hs);
  ST=3; names.forEach((n,i)=>line(Hs[i],r1.N[i],'cn')); lab(r1.N,'_3',COL.p3); shape(r1.N,COL.p3);
  ST=4; axis(r2,['П3','П4'],r1.N);
  ST=5; names.forEach((n,i)=>line(r1.N[i],r2.N[i],'cn'));
  poly([S4,A4,C4],COL.p4); line(S4,A4,'edge',COL.p4); line(S4,C4,'edge',COL.p4); line(A4,C4,'thin',COL.p4);
  text(S4,'S_4≡B_4',COL.p4); text(A4,'A_4',COL.p4); text(C4,'C_4',COL.p4);
  ST=6; const a1=Math.atan2(dA[1],dA[0]), r=Math.min(45,len(dA)*.5,len(dC)*.5);
  const g=arc(S4,add(S4,mul(nrm(dA),r)),add(S4,mul(nrm(dC),r)),COL.p4);
  text(add(S4,[r*1.5*Math.cos(g.mid),r*1.5*Math.sin(g.mid)]),'φ='+f(an)+'°',COL.p4,0,0,false);
  const X12=ax('П2','П1'), X13=ax('П1','П3'), X34=ax('П3','П4');
  const sf=k=>names.map(n=>n+k).join(', '), zs=names.map((n,i)=>`${n}: ${f(pts[i][2])}`).join(', '), ds=names.map((n,i)=>`${n}: ${f(r1.d[i]/K)}`).join(', ');
  STEPS=[
    `<b>Исходные данные.</b> ${names.map((n,i)=>`${n}(${pts[i].map(f).join('; ')})`).join(', ')}. Строим ось ${X12} и проекции вершин: горизонтальные ${sf(1)} (под осью) и фронтальные ${sf(2)} (над осью).`,
    `<b>Контур пирамиды SABC.</b> Соединяем вершины: боковые рёбра SA, SB, SC и основание AB, BC, CA — на П1 и П2 получаются замкнутые контуры. Вертикальными линиями связи соединяем одноимённые проекции. Общее ребро — BS (грани ABS и CBS).`,
    `<b>Первая замена П2 → П3.</b> Новую ось ${X13} проводим строго <b>параллельно B1S1</b> (на расстоянии ${GAP/K} ед. от ближайшей точки), чтобы BS стало параллельным П3.`,
    `<b>Проекции на П3.</b> Из каждой точки P1 опускаем перпендикуляр на ось ${X13} и по другую сторону оси откладываем высоту z (${zs}). Получаем ${sf(3)}. Отрезок B3S3 — истинная величина BS (И.В.) = <b>${f(len(sub(r1.N[1],r1.N[0]))/K)}</b>.`,
    `<b>Вторая замена П1 → П4.</b> Ось ${X34} проводим строго <b>перпендикулярно B3S3</b>, чтобы BS стало перпендикулярным П4.`,
    `<b>Проекции на П4.</b> Линии связи параллельны B3S3. От оси ${X34} откладываем расстояния от точек P1 до оси ${X13} (${ds}). Ребро BS проецируется в точку <b>S4≡B4</b>, грани ABS и CBS — в отрезки S4A4 и S4C4, основание ABC — в треугольник A4B4C4 (сторона A4C4).`,
    `<b>Измерение угла.</b> Двугранный угол φ измеряем при вершине S4≡B4 между лучами S4A4 и S4C4.<div class="res">φ = <b>${f(an)}°</b> (аналитическая проверка: ${f(chk)}°)</div>`
  ];
}

/* ================= Задача 2: истинная величина ABC вращением вокруг Q₁ ================= */
function solveRot(P){
  const nm=['A','B','C'], pts=nm.map(n=>P[n]), Hs=pts.map(H), Vs=pts.map(V);
  const N=x3(s3(P.B,P.A),s3(P.C,P.A)), nl=l3(N);
  if(nl<1e-9) throw new Error('Точки A, B, C лежат на одной прямой — треугольник вырожден.');
  if(Math.hypot(N[0],N[1])<1e-9*nl) throw new Error('Плоскость параллельна П1: след Q₁ не существует, A1B1C1 уже равен истинной величине.');
  if(Math.abs(N[2])<1e-9*nl) throw new Error('Плоскость перпендикулярна П1 (проекция A1B1C1 — отрезок). Измените координаты.');
  
  const c0=d3(N,P.A), q=c0/(N[0]*N[0]+N[1]*N[1]), T0=H([N[0]*q,N[1]*q]), tt=nrm([N[1],N[0]]), nn=[-tt[1],tt[0]];
  const trp=[]; [[0,1],[1,2],[2,0]].forEach(([i,j])=>{
    const dz=pts[j][2]-pts[i][2]; if(Math.abs(dz)<1e-9) return;
    const u=-pts[i][2]/dz, M=[pts[i][0]+(pts[j][0]-pts[i][0])*u, pts[i][1]+(pts[j][1]-pts[i][1])*u];
    trp.push({i,j,M1:H(M),M2:[-M[0]*K,0],n:trp.length+1});
  });

  const zLens = Hs.map((p,i) => len(sub(Vs[i], p)));
  const dd=Hs.map(p=>dot(sub(p,T0),nn)), big=dd.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a,0), side0=big>=0?1:-1;
  const G=Hs.map((p,i)=>{
    const sg=-(Math.abs(dd[i])<1e-9?side0:Math.sign(dd[i]));
    const O=sub(p,mul(nn,dd[i])), R=Math.hypot(dd[i], zLens[i]);
    return {O,R,sg,D:add(p,mul(tt, zLens[i])),Z:add(O,mul(nn,sg*R))};
  });

  const O_B = G[1].O, R_B = G[1].R, sg_B = G[1].sg;
  const B0 = add(O_B, mul(nn, sg_B * R_B));
  const Z_all = [...Hs]; Z_all[1] = B0;
  const traceLines = [];

  trp.forEach(t => {
    const M1 = t.M1;
    if (t.i === 1 || t.j === 1) {
      const other = (t.i === 1) ? t.j : t.i;
      const p1 = M1, p2 = B0, p3 = Hs[other], p4 = add(Hs[other], mul(nn, 100));
      const det = (p2[0]-p1[0])*(p4[1]-p3[1]) - (p2[1]-p1[1])*(p4[0]-p3[0]);
      if(Math.abs(det) > 1e-5){
        const t_val = ((p3[0]-p1[0])*(p4[1]-p3[1]) - (p3[1]-p1[1])*(p4[0]-p3[0])) / det;
        Z_all[other] = [p1[0] + t_val*(p2[0]-p1[0]), p1[1] + t_val*(p2[1]-p1[1])];
        traceLines.push({a: M1, b: Z_all[other]});
      }
    }
  });
  for(let i=0; i<3; i++){ if(!Z_all[i]) Z_all[i] = G[i].Z; }

  const xs=[...Hs,...Vs].map(p=>p[0]), x0=Math.min(...xs)-20, x1=Math.max(...xs)+20;
  const ss=[...Hs,...G.map(g=>g.O),...trp.map(t=>t.M1)].map(p=>dot(p,tt)), s0=Math.min(...ss)-30, s1=Math.max(...ss)+30;

  ST=0; line([x0,0],[x1,0],'ax','#111'); axisLabel([x0,0],['П2','П1']);
  nm.forEach((n,i)=>{text(Hs[i],n+'_1',COL.h); text(Vs[i],n+'_2',COL.v)});
  
  ST=1; [[0,1],[1,2],[2,0]].forEach(([i,j])=>{line(Hs[i],Hs[j],'edge',COL.h); line(Vs[i],Vs[j],'edge',COL.v)});
  poly(Hs,COL.h); poly(Vs,COL.v); nm.forEach((n,i)=>line(Hs[i],Vs[i],'cn'));
  
  ST=2; trp.forEach((t,k)=>{
    const near=len(sub(Vs[t.i],t.M2))<len(sub(Vs[t.j],t.M2))?t.i:t.j;
    line(Vs[near],t.M2,'cn'); line(Hs[near],t.M1,'cn'); line(t.M2,t.M1,'cn');
    if(!trp.slice(0,k).some(o=>len(sub(o.M1,t.M1))<1)){ text(t.M2,t.n+'_2',COL.v); text(t.M1,t.n+'_1',COL.tr); }
  });
  
  ST=3; line(add(T0,mul(tt,s0)),add(T0,mul(tt,s1)),'edge',COL.tr); text(add(T0,mul(tt,s1)),'Q_1',COL.tr,6,-8,false);
  
  ST=4; nm.forEach((n,i)=>{
    const g=G[i]; line(add(g.O,mul(nn,-g.sg*10)),add(g.O,mul(nn,g.sg*(g.R+14))),'cn',COL.tr);
    if(n==='B') text(g.O,'O_1',COL.tr, 8, 8);
  });

  ST=5; {
    const i = 1, n = 'B', g = G[i], k = i + 1;
    line(Hs[i], g.O, 'thin', COL.tr); 
    line(Hs[i], g.D, 'thin', COL.tr); 
    line(g.O, g.D, 'thin', COL.tr);
    line(Vs[i], Hs[i], 'thin', COL.v); 
    ticks(Vs[i], Hs[i], k, COL.v); 
    ticks(Hs[i], g.D, k, COL.tr);
    text(mul(add(Vs[i], Hs[i]), 0.5), 'z_' + n, COL.v, 6, 0, false);
    text(g.D, 'z_' + n, COL.tr, 5, 12, false);
    const u1 = nrm(sub(g.O, Hs[i])), u2 = nrm(sub(g.D, Hs[i])), q = 7;
    line(add(Hs[i], mul(u1, q)), add(add(Hs[i], mul(u1, q)), mul(u2, q)), 'thin', COL.tr); 
    line(add(Hs[i], mul(u2, q)), add(add(Hs[i], mul(u2, q)), mul(u1, q)), 'thin', COL.tr);
  }

  ST=6; {
    const i = 1; arc(G[i].O, G[i].D, G[i].Z, COL.p4);
    traceLines.forEach(l => line(l.a, l.b, 'cn', COL.p4));
  }
  const Z=Z_all; poly(Z,COL.p4); [[0,1],[1,2],[2,0]].forEach(([i,j])=>line(Z[i],Z[j],'edge',COL.p4));
  nm.forEach((n,i)=>text(Z[i],n+'_0',COL.p4));
  const cz=mul(add(add(Z[0],Z[1]),Z[2]),1/3); text(cz,'И.В.',COL.p4,-14,5,false);
  
  const sd=[[0,1],[1,2],[2,0]].map(([i,j])=>len(sub(Z[i],Z[j]))/K), tr=[[0,1],[1,2],[2,0]].map(([i,j])=>l3(s3(pts[i],pts[j])));
  const area=Math.abs((Z[1][0]-Z[0][0])*(Z[2][1]-Z[0][1])-(Z[2][0]-Z[0][0])*(Z[1][1]-Z[0][1]))/2/K/K;
  const X12=ax('П2','П1');

  STEPS=[
    `<b>Исходные данные.</b> ${nm.map((n,i)=>`${n}(${pts[i].map(f).join('; ')})`).join(', ')}. Строим ось ${X12}, горизонтальные проекции A1, B1, C1 (под осью) и фронтальные A2, B2, C2 (над осью).`,
    `<b>Проекции треугольника.</b> Соединяем точки: получаем A1B1C1 и A2B2C2. Одноимённые проекции связываем вертикальными линиями связи.`,
    `<b>Следы сторон (точки 1, 2, 3).</b> Продолжаем фронтальную проекцию стороны до пересечения с осью ${X12} (точки 1₂, 2₂, 3₂), опускаем линию связи на горизонтальную проекцию той же стороны — получаем точки 1₁, 2₁, 3₁, в которых стороны пронзают П1. ${trp.length<3?'Сторона, параллельная П1, следа не имеет. ':''}Найдено точек: ${trp.length}.`,
    `<b>Горизонтальный след Q₁.</b> Прямая, проходящая через точки 1₁, 2₁, 3₁, — горизонтальный след плоскости треугольника. Это ось вращения: плоскость ABC совмещаем с П1, поворачивая её вокруг Q₁.`,
    `<b>Перпендикуляры к следу.</b> Из вершин A1, B1, C1 опускаем перпендикуляры на след Q₁. Центр вращения (O₁) отмечается только для средней вершины B₁, а для остальных перпендикуляры идут дальше как линии перемещения точек.`,
    `<b>Прямоугольный треугольник (истинный радиус вращения).</b> Для базовой вершины B строим прямоугольный треугольник. Катет 1 — отрезок до следа. Катет 2 — высота z<sub>B</sub> (измеряется напрямую от B₂ до B₁ по линии связи). Равенство отрезков показано штрихами «//». Гипотенуза — истинный радиус вращения для B.`,
    `<b>Дуга вращения и истинная величина.</b> Из центра O₁ проводим дугу радиусом R до пересечения с перпендикуляром — получаем точку B₀. Соединяя следы сторон с точкой B₀ и находя пересечение с перпендикулярами, получаем точки A₀ и C₀ (показано пунктиром). Треугольник A₀B₀C₀ — истинная величина (И.В.).<div class="res">AB = <b>${f(sd[0])}</b>, BC = <b>${f(sd[1])}</b>, CA = <b>${f(sd[2])}</b>; площадь = <b>${f(area)}</b><br><small>Проверка по координатам: AB=${f(tr[0])}, BC=${f(tr[1])}, CA=${f(tr[2])}; S=${f(nl/2)}</small></div>`
  ];
}

/* ================= Отрисовка и пошаговый режим ================= */
const STYLE=`<style>text{font-family:Georgia,serif;font-style:italic}.cn{stroke:#8a9a9e;stroke-dasharray:5 4;stroke-width:1}.ax{stroke-width:1.6}.edge{stroke-width:3}.thin{stroke-width:1.5}</style>`;
function frac(t,fs){
  const x=t.p[0], y=t.p[1]-6*fs/13, yl=y-fs*.3, xl=x+fs*.8, w=fs*1.5, a=`font-size="${fs*.8}" fill="#111" text-anchor="middle"`;
  return `<text x="${x}" y="${y}" font-size="${fs}" fill="#111">X</text><line x1="${xl}" y1="${yl}" x2="${xl+w}" y2="${yl}" stroke="#111"/><text x="${xl+w/2}" y="${yl-fs*.12}" ${a}>${t.fr[0]}</text><text x="${xl+w/2}" y="${yl+fs*.68}" ${a}>${t.fr[1]}</text>`;
}
function fit(){
  const q=[]; IT.forEach(i=>{
    if(i.k==='l')q.push(i.a,i.b); else if(i.k==='t')q.push(i.p); else if(i.k==='p')q.push(...i.a);
    else if(i.k==='a')q.push(i.p1,i.p2,i.m); else q.push(i.p,add(i.p,[110,0]),add(i.p,[0,-45]),add(i.p,[0,45]));
  });
  const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]), M=50, x0=Math.min(...xs)-M, y0=Math.min(...ys)-M;
  const w=Math.max(...xs)-x0+M, h=Math.max(...ys)-y0+M;
  VB={x0,y0,w,h,fs:Math.max(13,Math.max(w,h)/48)};
}
function lbl(t,fs){
  const parts=String(t).split(/_(\w)/), sh=fs*.28; let o='', afterSub=false;
  parts.forEach((s,i)=>{
    if(i%2===0){ if(s!==''){o+=`<tspan${afterSub?` dy="${-sh}"`:''}>${s}</tspan>`; afterSub=false;} }
    else { o+=`<tspan dy="${afterSub?0:sh}" font-size="${fs*.7}">${s}</tspan>`; afterSub=true; }
  });
  return o;
}
function paint(){
  const last=STEPS.length-1, c=done?last:cur, v=IT.filter(i=>i.s<=c), fs=VB.fs, P=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
  let s=STYLE+`<rect x="${VB.x0}" y="${VB.y0}" width="${VB.w}" height="${VB.h}" fill="#fff"/>`;
  v.filter(i=>i.k==='p').forEach(g=>s+=`<polygon points="${g.a.map(P).join(' ')}" fill="${g.col}" fill-opacity=".12"/>`);
  v.filter(i=>i.k==='l').forEach(l=>s+=`<line x1="${l.a[0]}" y1="${l.a[1]}" x2="${l.b[0]}" y2="${l.b[1]}" class="${l.cls}" stroke="${l.col||''}"/>`);
  v.filter(i=>i.k==='a').forEach(a=>s+=`<path d="${a.d}" fill="none" stroke="${a.col}" stroke-width="2"/>`);
  
  // Автоматическое объединение пересекающихся/совпадающих текстовых меток точек
  const textMap = new Map();
  v.filter(i=>i.k==='t').forEach(t => {
    let key = null;
    for(let k of textMap.keys()) {
      const [x, y] = k.split(',').map(Number);
      if(Math.hypot(x - t.p[0], y - t.p[1]) < 4) { key = k; break; }
    }
    if(!key) {
      key = `${Math.round(t.p[0])},${Math.round(t.p[1])}`;
      textMap.set(key, {p: t.p, col: t.col, dx: t.dx, dy: t.dy, dot: t.dot, texts: []});
    }
    const entry = textMap.get(key);
    if(!entry.texts.includes(t.t)) entry.texts.push(t.t);
  });

  textMap.forEach(cl => {
    const combinedText = cl.texts.join(' = ');
    s += `${cl.dot?`<circle cx="${cl.p[0]}" cy="${cl.p[1]}" r="2.6" fill="${cl.col}"/>`:''}<text x="${cl.p[0]+cl.dx*fs/13}" y="${cl.p[1]+cl.dy*fs/13}" font-size="${fs}" fill="${cl.col}">${lbl(combinedText,fs)}</text>`;
  });

  v.filter(i=>i.k==='f').forEach(t=>s+=frac(t,fs));
  const e=$('epure'); e.setAttribute('viewBox',`${VB.x0} ${VB.y0} ${VB.w} ${VB.h}`); e.innerHTML=s;
  $('sn').textContent=done?'Готовое решение':`Шаг ${cur+1} из ${STEPS.length}`;
  $('prev').disabled=!done&&cur===0; $('next').disabled=done||cur>=last;
  $('done').classList.toggle('on',done);$('done').classList.toggle('alt',!done); $('done').setAttribute('aria-pressed',done);$('cur').innerHTML=STEPS[c];
}
const subs=h=>h.replace(/(?<![A-Za-z])([ABCSO])([0-4])(?![0-9])/g,'$1<sub>$2</sub>');
function build(){
  Object.entries(TASKS).forEach(([id,t])=>{
    const b=document.createElement('button'); b.className='task'; b.dataset.id=id;
    b.innerHTML=`<b>${t.title}</b><small>${t.desc}</small>`; b.onclick=()=>{task=id;cur=0;render()}; $('tasks').appendChild(b);
  });
  $('pts').innerHTML='<div class="pt"><span></span><span class="h">X</span><span class="h">Y</span><span class="h">Z</span></div>';
  for(const n of 'ABCS'){
    const r=document.createElement('div'); r.className='pt'; r.id='row'+n;
    r.innerHTML=`<b>${n}</b>`+[0,1,2].map(i=>`<input type="number" step="any" id="${n}${i}" aria-label="${n} ${'XYZ'[i]}">`).join('');
    $('pts').appendChild(r);
  }
  fill(); $('pts').addEventListener('input',render);
}
function fill(){ for(const n in DEF) DEF[n].forEach((v,i)=>$(n+i).value=v); }
function render(){
  document.querySelectorAll('.task').forEach(b=>b.classList.toggle('on',b.dataset.id===task));
  const T=TASKS[task]; $('leg').innerHTML=T.leg.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');
  for(const n of 'ABCS') $('row'+n).hidden=!T.pts.includes(n);
  const P={}; for(const n of T.pts) P[n]=[0,1,2].map(i=>parseFloat($(n+i).value)||0);
  IT=[]; STEPS=[]; ST=0;
  try{
    (task==='dihedral'?solveDihedral:solveRot)(P);
    STEPS=STEPS.map(subs);
    cur=Math.min(cur,STEPS.length-1); fit(); paint();
    $('steps').innerHTML='<ol>'+STEPS.map(s=>`<li>${s}</li>`).join('')+'</ol>';
    $('png').disabled=$('dl').disabled=$('done').disabled=false;
  }catch(err){
    $('epure').innerHTML='';$('cur').innerHTML=`<p class="err">${err.message}</p>`; $('steps').innerHTML='';
    $('sn').textContent='';$('prev').disabled=$('next').disabled=$('png').disabled=$('dl').disabled=$('done').disabled=true;
  }
}
$('prev').onclick=()=>{   if(done){done=false;cur=Math.max(0,STEPS.length-2)} else if(cur>0)cur--;   paint(); };$('next').onclick=()=>{if(!done&&cur<STEPS.length-1){cur++;paint()}};
$('done').onclick=()=>{done=!done;paint()};$('reset').onclick=()=>{fill();render()};
const svgXml=(w,h)=>{
  const e=$('epure').cloneNode(true); e.setAttribute('width',w); e.setAttribute('height',h); e.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(e);
};
const save=(url,name)=>{const a=document.createElement('a'); a.href=url; a.download=name; a.click()};
$('dl').onclick=()=>save(URL.createObjectURL(new Blob([svgXml(1000,Math.round(1000*VB.h/VB.w))],{type:'image/svg+xml'})),'epure.svg');$('png').onclick=()=>{
  const W=2400, Hh=Math.min(6000,Math.round(W*VB.h/VB.w)), img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=W; c.height=Hh; const g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,W,Hh); g.drawImage(img,0,0,W,Hh);
    c.toBlob(b=>save(URL.createObjectURL(b),done?'epure-gotovoe-reshenie.png':`epure-shag${cur+1}.png`),'image/png');
  };
  img.onerror=()=>alert('Не удалось создать PNG. Попробуйте «Скачать SVG».');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgXml(W,Hh));
};
build(); render();
</script>
